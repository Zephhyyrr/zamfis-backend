name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ke VPS SurauZamzam
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Memuat NVM agar npm dan pm2 dapat dieksekusi di sesi SSH ini
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Pindah ke folder backend
            cd /var/www/surauzamzam/backend
            
            # Tarik update terbaru
            git pull origin main
            
            # Install package baru
            npm install
            
            # Generate Prisma
            npx prisma generate
            
            # Restart PM2 dengan nama proses yang benar (backend)
            pm2 restart backend || pm2 start index.js --name "backend"
            pm2 save