name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ke VPS SurauZamzam
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /var/www/surauzamzam/backend
            
            set -a
            source .env.production
            set +a
            
            git pull origin main
            
            npm install
            
            npm run build
            
            npx prisma migrate deploy
            
            pm2 restart backend || pm2 start dist/server.js --name "backend" --node-args="--openssl-legacy-provider"
            pm2 save