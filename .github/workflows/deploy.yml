name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ke VPS SurauZamzam
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pindah ke folder backend
            cd /var/www/surauzamzam/backend
            
            # Tarik update terbaru
            git pull origin main
            
            # Install package baru
            npm install
            
            # Generate Prisma (Hapus baris ini jika tidak pakai Prisma)
            npx prisma generate
            
            # Restart PM2
            pm2 restart backend-api || pm2 start index.js --name "backend-api"
            pm2 save